version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      next-stack:
        patterns:
          - 'next'
          - 'next-auth'
          - '@auth/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      types:
        patterns:
          - '@types/*'

  # apps/solver pins ortools and pyvrp exactly (requirements.txt): a PR bumping either is an engine change. It
  # fails test_ortools_version_is_pinned / test_pyvrp_version_is_pinned on purpose; merge it only after the
  # replay of saved real requests (docs/PROJECT_HANDBOOK.md 5.4), never on CI alone.
  - package-ecosystem: pip
    directory: /apps/solver
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
