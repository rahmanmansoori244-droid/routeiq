name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Web (lint + typecheck + unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: routeiq
          POSTGRES_PASSWORD: routeiq
          POSTGRES_DB: routeiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routeiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://routeiq:routeiq@localhost:5432/routeiq?schema=public
      NEXTAUTH_SECRET: ci-only-secret-must-be-set-but-not-real
      NEXTAUTH_URL: http://localhost:3000
      SOLVER_URL: http://localhost:8000
      SOLVER_TOKEN: ci-only-solver-token-must-match
      # Production mode (`pnpm start`) accepts only its own janitor token, never SOLVER_TOKEN.
      JANITOR_TOKEN: ci-only-janitor-token
      RATE_LIMITS_DISABLED: '1'
      # The integration helper signs up a tenant per suite. Open is the default; set explicitly
      # so a future default change cannot break CI silently.
      SIGNUP_MODE: open
      # Lets tests/integration/auth.spec.ts check that sign-up never grants SUPER_ADMIN.
      SUPER_ADMIN_EMAILS: platform-admin@routeiq-ci.test
      # A THOROUGH search may take this long (web and solver read it; production: 1200 = 20 min).
      # tests/integration/long-search.spec.ts runs a THOROUGH optimization end to end only when
      # it is small.
      THOROUGH_MAX_SEC: '60'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      # Node 22 LTS, pinned for CI and the Railway build alike (root package.json engines, .nvmrc).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @routeiq/web exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @routeiq/web exec prisma migrate deploy

      - name: TypeScript check
        run: pnpm --filter @routeiq/web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @routeiq/web exec next lint --max-warnings 0

      - name: Vitest unit + tenant-isolation suite
        run: pnpm --filter @routeiq/web exec vitest run tests/lib tests/tenant-isolation.spec.ts

      - name: Install solver deps
        working-directory: apps/solver
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Start solver in background
        working-directory: apps/solver
        run: |
          nohup .venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000 > solver.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health

      - name: Build Next.js
        run: pnpm --filter @routeiq/web build

      # Audit F01 / owner decision 4 and the source-map side item: no use-server directive in the
      # app's code, no Server Action in the built manifest, no .map file under .next/static.
      - name: Build output check (no Server Actions, no public source maps)
        run: pnpm --filter @routeiq/web exec tsx scripts/check-build-output.ts

      - name: Start Next.js in background
        working-directory: apps/web
        run: |
          nohup pnpm start > web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health

      # The running app: the image endpoint answers 404 (with it on, w=1 would answer 400), and
      # the source map of a real browser chunk is not served.
      - name: Image endpoint off, source maps not served
        working-directory: apps/web
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3000/_next/image?url=%2Ffavicon.ico&w=1&q=75')
          echo "/_next/image -> $code"
          test "$code" = 404
          chunk=$(cd .next/static/chunks && ls *.js | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/_next/static/chunks/$chunk")
          echo "/_next/static/chunks/$chunk -> $code"
          test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/_next/static/chunks/$chunk.map")
          echo "/_next/static/chunks/$chunk.map -> $code"
          test "$code" = 404

      - name: Integration tests (web + solver up)
        run: pnpm --filter @routeiq/web exec vitest run tests/integration

      - name: Dump web log on failure
        if: failure()
        working-directory: apps/web
        run: tail -200 web.log || true

      - name: Dump solver log on failure
        if: failure()
        working-directory: apps/solver
        run: tail -200 solver.log || true

      - name: Show kernel out-of-memory kills on failure
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -i -E "killed process|out of memory|oom" | tail -20 || true

  solver:
    name: Solver (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install solver deps
        working-directory: apps/solver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: apps/solver
        run: pytest tests -v
