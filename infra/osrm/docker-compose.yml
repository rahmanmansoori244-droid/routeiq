# RouteIQ OSRM on a VM or the NMWC on-prem server.
#   docker compose -f infra/osrm/docker-compose.yml up -d --build
#   OSRM_URL=http://127.0.0.1:5000 sh infra/osrm/smoke-test.sh
# Monthly map refresh: docker compose -f infra/osrm/docker-compose.yml build --pull --no-cache && docker compose -f infra/osrm/docker-compose.yml up -d
services:
  osrm:
    build:
      context: .
      # args:
      #   BBOX: "51.5,16.4,60.0,26.6"   # Oman + UAE (default)
    image: routeiq-osrm:latest
    container_name: routeiq-osrm
    restart: unless-stopped
    # OSRM has no authentication: bind to localhost / the private LAN only, never 0.0.0.0 on a
    # public interface. Point the solver at it with OSRM_URL=http://<this-host>:5000.
    ports:
      - '127.0.0.1:5000:5000'
    mem_limit: 2g
    # The health check script (audit F19), mounted read-only so the image stays as built.
    volumes:
      - ./healthcheck.sh:/usr/local/bin/routeiq-osrm-healthcheck:ro
    # Healthy = the running server answers a real in-region query: /nearest for the Muscat depot
    # returns HTTP 200 with "code":"Ok" within 4 s (healthcheck.sh). A hung server, one that lost
    # its graph, or a wrong map fails; `docker ps` then shows the container unhealthy.
    healthcheck:
      test: ['CMD', 'sh', '/usr/local/bin/routeiq-osrm-healthcheck']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
